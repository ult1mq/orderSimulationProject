logging:
  level:
    org.springframework.cloud.gateway: DEBUG


server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-swagger
              uri: http://user-service:8082
              predicates:
                - Path=/swagger/users/swagger-ui.html
                - Path=/swagger/users/swagger-ui/**
                - Path=/swagger/users/v3/api-docs
                - Path=/swagger/users/webjars/**
              filters:
                - StripPrefix=2

            - id: user-service
              uri: http://user-service:8082
              predicates:
                - Path=/users/**
            - id: product-service
              uri: http://product-service:8081
              predicates:
                - Path=/products/**
            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/orders/**


